# managed-by: agentic-playbook v1.0.0
# Required check name: "security / scan"
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly full scan, catches newly disclosed CVEs
permissions: {}

jobs:
  scan:
    uses: cloudcitiwa/agentic-playbook/.github/workflows/reusable-security.yml@<<PLAYBOOK_SHA>> # v1.0.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # dependency-review comments its summary on failure
      actions: read
    with:
      codeql-languages: '<<FILL: ["javascript-typescript","python"]>>'
      iac-paths: '<<FILL: ["infra"]>>'
