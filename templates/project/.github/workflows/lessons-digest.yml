# managed-by: agentic-playbook v1.0.0
# Weekly digest of new LESSONS.md entries; feeds the monthly rule review (docs/10 §10.2).
name: lessons-digest
on:
  schedule:
    - cron: "0 21 * * 4"   # Thursday 21:00 UTC
  workflow_dispatch:
permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: <org>/agentic-playbook, ref: v1.0.0, path: .playbook, persist-credentials: false}
      - name: Build digest
        run: python3 .playbook/scripts/validate-lessons.py --file LESSONS.md --digest --since-days 7 > digest.md
      - name: Open digest issue
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if grep -q "No new lessons" digest.md; then exit 0; fi
          gh issue create --title "Lessons digest $(date -u +%F)" --label lessons-digest --body-file digest.md
