# managed-by: agentic-playbook v1.0.0
# Weekly: if a newer playbook release exists, open a PR updating managed files.
# Uses a GitHub App token because org policy forbids GITHUB_TOKEN from creating PRs.
name: playbook-sync
on:
  schedule:
    - cron: "0 22 * * 0"   # Sunday 22:00 UTC
  workflow_dispatch:
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLAYBOOK_BOT_APP_ID }}
          private-key: ${{ secrets.PLAYBOOK_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with: {token: "${{ steps.app.outputs.token }}"}
      - name: Find latest playbook release
        id: latest
        env: {GH_TOKEN: "${{ steps.app.outputs.token }}"}
        run: |
          latest=$(gh release view --repo cloudcitiwa/agentic-playbook --json tagName -q .tagName)
          current=$(cat .playbook-version)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Apply update
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        env: {GH_TOKEN: "${{ steps.app.outputs.token }}", NEW: "${{ steps.latest.outputs.latest }}"}
        run: |
          gh release download "$NEW" --repo cloudcitiwa/agentic-playbook --archive tar.gz -O /tmp/pb.tgz
          mkdir -p /tmp/pb && tar -xzf /tmp/pb.tgz -C /tmp/pb --strip-components=1
          bash /tmp/pb/scripts/sync.sh --apply --version "$NEW"
          git switch -c "chore/playbook-$NEW"
          git -c user.name="playbook-bot" -c user.email="playbook-bot@users.noreply.github.com" commit -am "chore(playbook): update managed files to $NEW"
          git push -u origin HEAD
          gh pr create --title "chore(playbook): update to $NEW" \
            --body "Automated playbook update. Review the CHANGELOG: https://github.com/cloudcitiwa/agentic-playbook/releases/tag/$NEW . Merge within 10 business days (docs/02 §2.5)." \
            --label playbook-sync
