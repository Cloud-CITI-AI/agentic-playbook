# Reusable security scanning. Required check: "security / scan" (the caller's job name is "scan").
name: reusable-security
on:
  workflow_call:
    inputs:
      codeql-languages: {type: string, required: true}
      iac-paths: {type: string, required: false, default: '[]'}
permissions: {}

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: gitleaks (commit range for PRs, full history otherwise)
        env:
          GITLEAKS_VERSION: "8.28.0"   # verify current release; Renovate regex manager keeps it updated
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks git --redact --log-opts="${BASE}..${HEAD}"
          else
            ./gitleaks git --redact
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, MPL-2.0, Unlicense, CC0-1.0, Python-2.0
          comment-summary-in-pr: on-failure

  codeql:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write, actions: read}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@v3
        with: {languages: "${{ matrix.language }}", queries: security-extended}
      - uses: github/codeql-action/analyze@v3
        with: {category: "/language:${{ matrix.language }}"}

  workflows:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: zizmor (GitHub Actions security lint)
        run: |
          pipx install zizmor >/dev/null
          zizmor --min-severity medium --format github .github/workflows

  iac:
    if: inputs.iac-paths != '[]'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    strategy:
      matrix:
        path: ${{ fromJSON(inputs.iac-paths) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Checkov
        env: {IAC_PATH: "${{ matrix.path }}"}
        run: |
          pipx install checkov >/dev/null
          checkov -d "$IAC_PATH" --compact --quiet --soft-fail-on LOW,MEDIUM
