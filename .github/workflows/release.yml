# Releases of the playbook itself: release-please PR approved by platform-eng; eval gate must pass on the release PR.
name: release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with: {release-type: simple}
